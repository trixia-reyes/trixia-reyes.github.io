<!doctype html>
<!-- Source for assets/img/og-card.jpg, the image shown when the site link is shared (WhatsApp, LinkedIn, etc.).
     Regenerate: see README, "Link preview image". Rendered at exactly 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --plum:#3b1f6b; --violet:#6d3fd0; --violet-2:#8b5cf6; --lilac:#c4b0f5; --lavender:#ece4fd; --ink-soft:#5a4d70; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Manrope", Arial, sans-serif; color: var(--plum);
    background:
      radial-gradient(circle at 82% 18%, rgba(139,92,246,.20), transparent 46%),
      linear-gradient(135deg, #fbf9ff 0%, #f1ebfd 55%, #e6dcfb 100%);
  }
  /* "TReyes" watermark, as at the foot of the site */
  .mark {
    position: absolute; left: 30px; bottom: -70px; font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 300px; line-height: 1; letter-spacing: -.035em; color: rgba(139,92,246,.09); white-space: nowrap;
  }
  .mark i { font-style: italic; font-weight: 400; }

  .text { position: absolute; left: 80px; top: 92px; width: 640px; }
  .eyebrow { font-size: 17px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: var(--violet); }
  h1 {
    margin-top: 26px; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 98px;
    line-height: .95; letter-spacing: -.035em; color: var(--plum);
  }
  h1 span { display: block; }
  h1 .last {
    font-style: italic; font-weight: 400; width: fit-content;
    background: linear-gradient(100deg, var(--violet) 10%, var(--violet-2) 50%, var(--plum) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .14em .2em .06em; margin: 0 -.14em -.2em -.06em;
  }
  .roles { margin-top: 30px; font-size: 25px; font-weight: 600; color: var(--ink-soft); line-height: 1.45; }
  .roles b { color: var(--violet); font-weight: 700; }
  .url {
    position: absolute; left: 80px; bottom: 66px; display: flex; align-items: center; gap: 14px;
    font-size: 22px; font-weight: 700; color: var(--plum);
  }
  .mono {
    width: 46px; height: 46px; border-radius: 12px; background: var(--plum); color: #efe7ff;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 21px; letter-spacing: -.02em;
  }
  .mono i { font-style: italic; font-weight: 400; color: var(--lilac); margin-left: .02em; }

  /* Portrait: same arch frame, lavender multiply and soft-light purple tint as the site's hero */
  .ring {
    position: absolute; right: 52px; top: 40px; width: 360px; height: 520px;
    border: 2px solid var(--lilac); border-radius: 180px 180px 30px 30px;
  }
  .frame {
    position: absolute; right: 74px; top: 62px; width: 360px; height: 520px; overflow: hidden;
    border-radius: 180px 180px 30px 30px; background: linear-gradient(180deg, #e9defd 0%, #cdb9f6 100%);
    box-shadow: 0 30px 60px -20px rgba(59,31,107,.45);
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; mix-blend-mode: multiply; filter: saturate(.88) contrast(1.03); }
  .frame::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(160deg, rgba(139,92,246,.55), rgba(59,31,107,.6)); mix-blend-mode: soft-light; opacity: .9;
  }
</style>
</head>
<body>
  <div class="mark">T<i>Reyes</i></div>

  <div class="text">
    <p class="eyebrow">Psychology · Education · People</p>
    <h1><span>Trixia Anne</span><span class="last">Reyes</span></h1>
    <p class="roles">Psychology Educator &amp; Researcher<br><b>Certified HR Associate</b> · L&amp;D</p>
  </div>
  <p class="url"><span class="mono">T<i>R</i></span>trixia-reyes.github.io</p>

  <div class="ring"></div>
  <div class="frame"><img src="../assets/img/profile.jpg" alt=""></div>
</body>
</html>
